<svg xmlns="http://www.w3.org/2000/svg" width="560" height="470" viewBox="0 0 560 470" role="img" aria-labelledby="t">
  <title id="t">Three robot agents send a plan, a reminder and a call to a phone</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#00305c"/>
      <stop offset="1" stop-color="#001127"/>
    </linearGradient>
    <radialGradient id="burst" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7df9ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7df9ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="2.2" fill="#00a6fb"/>
    </pattern>
    <radialGradient id="dotsFade" cx="0.15" cy="0.9" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotsMask"><rect width="560" height="470" fill="url(#dotsFade)"/></mask>
    <clipPath id="panelClip"><rect x="12" y="12" width="536" height="446" rx="30"/></clipPath>

    <!-- One robot agent, drawn around (0,0) = the middle of its head. -->
    <g id="bot">
      <line x1="0" y1="-30" x2="0" y2="-46" stroke="#000814" stroke-width="4" stroke-linecap="round"/>
      <rect x="-44" y="-30" width="88" height="66" rx="22" fill="currentColor" stroke="#000814" stroke-width="5"/>
      <rect x="-31" y="-18" width="62" height="40" rx="13" fill="#001127" stroke="#000814" stroke-width="3"/>
      <ellipse class="eye" cx="-13" cy="0" rx="6" ry="8" fill="#7df9ff"/>
      <ellipse class="eye" cx="13" cy="0" rx="6" ry="8" fill="#7df9ff"/>
      <circle cx="-11" cy="-3" r="2.2" fill="#fff"/>
      <circle cx="15" cy="-3" r="2.2" fill="#fff"/>
      <path d="M-9 13 Q0 19 9 13" fill="none" stroke="#7df9ff" stroke-width="3" stroke-linecap="round"/>
      <rect x="-50" y="-6" width="9" height="20" rx="4" fill="#0353a4" stroke="#000814" stroke-width="3.5"/>
      <rect x="41" y="-6" width="9" height="20" rx="4" fill="#0353a4" stroke="#000814" stroke-width="3.5"/>
      <path d="M-30 -22 Q-26 -27 -18 -27" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="4" stroke-linecap="round"/>
      <rect x="-30" y="40" width="60" height="44" rx="16" fill="currentColor" stroke="#000814" stroke-width="5"/>
      <circle cx="0" cy="60" r="7" fill="#001127" stroke="#000814" stroke-width="3"/>
      <circle class="core" cx="0" cy="60" r="3.2" fill="#7df9ff"/>
    </g>
  </defs>

  <style>
    .bubble text { font: 900 15px "Comic Neue", "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", system-ui, sans-serif;
      letter-spacing: .04em; fill: #000814; }
    .light { animation: blink 2.4s ease-in-out infinite; }
    .light.l2 { animation-delay: .8s; } .light.l3 { animation-delay: 1.6s; }
    .pop { transform-box: fill-box; transform-origin: 0% 100%; animation: pop 4.8s ease-in-out infinite; }
    .pop.p2 { transform-origin: 0% 0%; animation-delay: 1.6s; } .pop.p3 { transform-origin: 100% 100%; animation-delay: 3.2s; }
    .buzz { transform-box: fill-box; transform-origin: 50% 50%; animation: buzz 3.2s ease-in-out infinite; }
    .ring { animation: ring 1.6s ease-out infinite; } .ring.r2 { animation-delay: .4s; }
    .fly { stroke-dasharray: 6 9; animation: fly 1.4s linear infinite; }
    .bob { animation: bob 5s ease-in-out infinite; } .bob.b2 { animation-delay: -1.7s; } .bob.b3 { animation-delay: -3.3s; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes pop { 0%, 6% { transform: scale(.85); } 12%, 100% { transform: scale(1); } }
    @keyframes buzz { 0%, 70%, 100% { transform: rotate(0); } 74% { transform: rotate(-2.5deg); } 78% { transform: rotate(2.5deg); }
      82% { transform: rotate(-2deg); } 86% { transform: rotate(1.5deg); } }
    @keyframes ring { from { opacity: .9; } to { opacity: 0; } }
    @keyframes fly { to { stroke-dashoffset: -30; } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- Panel -->
  <rect x="12" y="12" width="536" height="446" rx="30" fill="url(#panel)"/>
  <g clip-path="url(#panelClip)">
    <rect width="560" height="470" fill="url(#dots)" mask="url(#dotsMask)" opacity=".5"/>
    <!-- Honeycomb in the corner -->
    <g fill="none" stroke="#00a6fb" stroke-opacity=".18" stroke-width="2">
      <path d="M470 40 l22 -12.7 22 12.7 v25.4 l-22 12.7 -22 -12.7z"/>
      <path d="M514 40 l22 -12.7 22 12.7 v25.4 l-22 12.7 -22 -12.7z"/>
      <path d="M492 78 l22 -12.7 22 12.7 v25.4 l-22 12.7 -22 -12.7z"/>
      <path d="M448 78 l22 -12.7 22 12.7 v25.4 l-22 12.7 -22 -12.7z"/>
    </g>
    <!-- Comic burst behind the phone -->
    <circle cx="300" cy="235" r="170" fill="url(#burst)"/>
    <g stroke="#7df9ff" stroke-opacity=".22" stroke-width="3" stroke-linecap="round">
      <line x1="300" y1="60" x2="300" y2="30"/><line x1="388" y1="83" x2="405" y2="57"/>
      <line x1="452" y1="148" x2="480" y2="133"/><line x1="452" y1="322" x2="480" y2="337"/>
      <line x1="300" y1="410" x2="300" y2="440"/><line x1="212" y1="83" x2="195" y2="57"/>
      <line x1="148" y1="148" x2="120" y2="133"/>
    </g>
  </g>
  <rect x="12" y="12" width="536" height="446" rx="30" fill="none" stroke="#1f4e7a" stroke-width="4"/>

  <!-- Messages flying to the phone -->
  <g fill="none" stroke="#7df9ff" stroke-width="3" stroke-linecap="round">
    <path class="fly" d="M150 128 C 190 120, 215 140, 236 160"/>
    <path class="fly" d="M150 404 C 200 400, 220 340, 236 312"/>
    <path class="fly" d="M400 330 C 385 325, 375 318, 366 310"/>
  </g>

  <!-- The phone -->
  <g class="buzz">
    <rect x="232" y="88" width="136" height="262" rx="26" fill="#001127" stroke="#000814" stroke-width="6"/>
    <rect x="243" y="112" width="114" height="214" rx="12" fill="#06294d"/>
    <rect x="281" y="98" width="38" height="6" rx="3" fill="#0e3a66"/>
    <!-- chat on the screen -->
    <rect x="251" y="124" width="76" height="26" rx="10" fill="#e6f4ff"/>
    <rect x="259" y="132" width="44" height="4" rx="2" fill="#0353a4"/><rect x="259" y="140" width="56" height="4" rx="2" fill="#0353a4" opacity=".5"/>
    <rect x="273" y="158" width="76" height="22" rx="10" fill="#00a6fb"/>
    <rect x="281" y="166" width="50" height="4" rx="2" fill="#001127"/>
    <rect x="251" y="188" width="86" height="34" rx="10" fill="#e6f4ff"/>
    <rect x="259" y="196" width="60" height="4" rx="2" fill="#0353a4"/><rect x="259" y="204" width="44" height="4" rx="2" fill="#0353a4" opacity=".5"/>
    <rect x="259" y="212" width="52" height="4" rx="2" fill="#0353a4" opacity=".5"/>
    <rect x="251" y="230" width="38" height="18" rx="9" fill="none" stroke="#7df9ff" stroke-width="2.5"/>
    <rect x="295" y="230" width="42" height="18" rx="9" fill="none" stroke="#7df9ff" stroke-width="2.5"/>
    <rect x="260" y="237" width="20" height="4" rx="2" fill="#7df9ff"/><rect x="304" y="237" width="24" height="4" rx="2" fill="#7df9ff"/>
    <!-- incoming call card -->
    <rect x="251" y="262" width="98" height="54" rx="12" fill="#001127" stroke="#00a6fb" stroke-width="2.5"/>
    <circle cx="272" cy="289" r="12" fill="#00a6fb" stroke="#000814" stroke-width="2.5"/>
    <rect x="290" y="280" width="46" height="5" rx="2.5" fill="#e6f4ff"/><rect x="290" y="291" width="32" height="4" rx="2" fill="#8fb3d9"/>
    <circle cx="368" cy="96" r="13" fill="#ff4d6d" stroke="#000814" stroke-width="4"/>
    <text x="368" y="101" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#fff">3</text>
  </g>
  <!-- ring waves -->
  <g fill="none" stroke="#7df9ff" stroke-width="3.5" stroke-linecap="round">
    <path class="ring" d="M384 150 q14 18 0 36"/><path class="ring r2" d="M396 140 q22 28 0 56"/>
    <path class="ring" d="M216 150 q-14 18 0 36"/><path class="ring r2" d="M204 140 q-22 28 0 56"/>
  </g>

  <!-- Agent 1: the planner, with a clipboard -->
  <g class="bob">
    <g transform="translate(96 150)">
      <use href="#bot" color="#00a6fb"/>
      <circle class="light" cx="0" cy="-50" r="7" fill="#7df9ff" stroke="#000814" stroke-width="3.5"/>
    </g>
    <g transform="translate(130 222) rotate(10)">
      <rect x="-16" y="-20" width="34" height="42" rx="5" fill="#e6f4ff" stroke="#000814" stroke-width="4"/>
      <rect x="-7" y="-25" width="16" height="9" rx="3" fill="#0353a4" stroke="#000814" stroke-width="3"/>
      <path d="M-9 -6 l4 4 7 -8 M-9 8 l4 4 7 -8" fill="none" stroke="#00a6fb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <g class="bubble pop">
    <path d="M28 42 h126 a14 14 0 0 1 14 14 v20 a14 14 0 0 1 -14 14 h-80 l-16 16 2 -16 h-32 a14 14 0 0 1 -14 -14 v-20 a14 14 0 0 1 14 -14z"
      fill="#fff" stroke="#000814" stroke-width="4" stroke-linejoin="round"/>
    <text x="91" y="72" text-anchor="middle">PLAN READY!</text>
  </g>

  <!-- Agent 2: the coach, with a dumbbell -->
  <g class="bob b2">
    <g transform="translate(104 330)">
      <use href="#bot" color="#7df9ff"/>
      <circle class="light l2" cx="0" cy="-50" r="7" fill="#00a6fb" stroke="#000814" stroke-width="3.5"/>
    </g>
    <g transform="translate(150 362) rotate(-28)">
      <rect x="-24" y="-4" width="48" height="8" rx="4" fill="#8fb3d9" stroke="#000814" stroke-width="3.5"/>
      <rect x="-36" y="-17" width="14" height="34" rx="5" fill="#0353a4" stroke="#000814" stroke-width="4"/>
      <rect x="-46" y="-12" width="11" height="24" rx="4" fill="#0353a4" stroke="#000814" stroke-width="4"/>
      <rect x="22" y="-17" width="14" height="34" rx="5" fill="#0353a4" stroke="#000814" stroke-width="4"/>
      <rect x="35" y="-12" width="11" height="24" rx="4" fill="#0353a4" stroke="#000814" stroke-width="4"/>
      <path d="M-33 -11 v8 M25 -11 v8" stroke="#7df9ff" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <path d="M178 322 l8 -8 M186 334 l11 -3 M168 318 l2 -11" stroke="#7df9ff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g class="bubble pop p2">
    <path d="M150 382 h112 a14 14 0 0 1 14 14 v20 a14 14 0 0 1 -14 14 h-112 a14 14 0 0 1 -14 -14 v-6 l-14 -6 14 -4 v-4 a14 14 0 0 1 14 -14z"
      fill="#fff" stroke="#000814" stroke-width="4" stroke-linejoin="round"/>
    <text x="206" y="412" text-anchor="middle">GYM AT 18:00</text>
  </g>

  <!-- Agent 3: calling you, with a headset -->
  <g class="bob b3">
    <g transform="translate(462 300)">
      <use href="#bot" color="#00a6fb"/>
      <circle class="light l3" cx="0" cy="-50" r="7" fill="#7df9ff" stroke="#000814" stroke-width="3.5"/>
      <path d="M-47 -2 C -50 -50, 50 -50, 47 -2" fill="none" stroke="#000814" stroke-width="10" stroke-linecap="round"/>
      <path d="M-47 -2 C -50 -50, 50 -50, 47 -2" fill="none" stroke="#e6f4ff" stroke-width="4" stroke-linecap="round"/>
      <rect x="-56" y="-12" width="16" height="30" rx="7" fill="#e6f4ff" stroke="#000814" stroke-width="4"/>
      <rect x="40" y="-12" width="16" height="30" rx="7" fill="#e6f4ff" stroke="#000814" stroke-width="4"/>
      <path d="M-48 16 C -48 32, -34 34, -20 30" fill="none" stroke="#000814" stroke-width="7" stroke-linecap="round"/>
      <path d="M-48 16 C -48 32, -34 34, -20 30" fill="none" stroke="#e6f4ff" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="-18" cy="30" r="6" fill="#7df9ff" stroke="#000814" stroke-width="3.5"/>
    </g>
  </g>
  <g class="bubble pop p3">
    <path d="M412 168 h118 a14 14 0 0 1 14 14 v20 a14 14 0 0 1 -14 14 h-36 l2 16 -18 -16 h-66 a14 14 0 0 1 -14 -14 v-20 a14 14 0 0 1 14 -14z"
      fill="#fff" stroke="#000814" stroke-width="4" stroke-linejoin="round"/>
    <text x="471" y="198" text-anchor="middle">RING RING!</text>
  </g>
</svg>
